syntax = "proto3";
import "models.proto";

package bsa.sharp_backend;
option csharp_namespace = "Bsa.CsharpBackend.Grpc";

import "google/protobuf/wrappers.proto";
import "google/type/money.proto";

service InvoiceService {
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse);

  rpc PayInvoice(PayInvoiceRequest) returns (PayInvoiceResponse);

  rpc RevokeInvoice(RevokeInvoiceRequest) returns (RevokeInvoiceResponse);

  rpc GetOutgoingInvoice(GetOutgoingInvoicesRequest) returns (GetOutgoingInvoicesResponse);

  rpc GetIncomingInvoice(GetIncomingInvoicesRequest) returns (GetIncomingInvoicesResponse);
}

message CreateInvoiceRequest {
  string session_id = 1;
  string sender_account_number = 2;
  string receiver_account_number = 3;
  google.type.Money amount = 4;
}

message CreateInvoiceResponse {
  Invoice invoice = 1;
}

message PayInvoiceRequest {
  string session_id = 1;
  int64 invoice_id = 2;
}

message PayInvoiceResponse {
  Invoice invoice = 1;
}

message RevokeInvoiceRequest {
  string session_id = 1;
  int64 invoice_id = 2;
}

message RevokeInvoiceResponse {
  Invoice invoice = 1;
}

message GetOutgoingInvoicesRequest {
  string session_id = 1;
  repeated string receiver_account_numbers = 2;
  repeated InvoiceStatus statuses = 3;
  Pagination pagination = 4;
}

message GetOutgoingInvoicesResponse {
  repeated Invoice invoices = 1;
  google.protobuf.StringValue page_token = 2;
}

message GetIncomingInvoicesRequest {
  string session_id = 1;
  repeated string sender_account_numbers = 2;
  repeated InvoiceStatus statuses = 3;
  Pagination pagination = 4;
}

message GetIncomingInvoicesResponse {
  repeated Invoice invoices = 1;
  google.protobuf.StringValue page_token = 2;
}