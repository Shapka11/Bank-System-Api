syntax = "proto3";
import "models.proto";

package bsa.sharp_backend;
option csharp_namespace = "Bsa.CsharpBackend.Grpc";


service AdminService {
  rpc Login(LoginAdminRequest) returns (LoginAdminResponse);

  rpc Logout(LogoutAdminRequest) returns (LogoutAdminResponse);
}

message LoginAdminRequest {
  string password = 1;
}

message LoginAdminResponse {
  Session session = 1;
}

message LogoutAdminRequest {
  string id = 1;
}

message LogoutAdminResponse { }
