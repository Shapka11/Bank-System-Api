syntax = "proto3";
import "models.proto";

package bank_system_api;
option csharp_namespace = "BankSystemApi.Grpc";

import "google/type/money.proto";
import "google/protobuf/wrappers.proto";

service AccountService {
  rpc Create(CreateAccountRequest) returns (CreateAccountResponse);

  rpc Deposit(DepositRequest) returns (DepositResponse);

  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);

  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);

  rpc Get(GetAccountsRequest) returns (GetAccountsResponse);
}

message CreateAccountRequest {
  string caller_user_id = 1;
  int64 target_user_id = 2;
  string account_number = 3;
  string password = 4;
}

message CreateAccountResponse {
  Account account = 1;
}

message DepositRequest {
  string user_id = 1;
  string account_id = 2;
  google.type.Money amount = 3;
}

message DepositResponse {
  Account account = 1;
}

message WithdrawRequest {
  string user_id = 1;
  string account_id = 2;
  google.type.Money amount = 3;
}

message WithdrawResponse {
  Account account = 1;
}

message GetBalanceRequest {
  string user_id = 1;
  string account_id = 2;
}

message GetBalanceResponse {
  google.type.Money balance = 1;
}

message GetAccountsRequest {
  string user_id = 1;
  Pagination pagination = 2;
}

message GetAccountsResponse {
  repeated Account accounts = 1;
  google.protobuf.StringValue page_token = 2;
}