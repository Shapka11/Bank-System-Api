syntax = "proto3";
import "models.proto";

package invoice_service;
option csharp_namespace = "BankSystemApi.Invoices.Grpc";

import "google/protobuf/wrappers.proto";
import "google/type/money.proto";

service InvoiceService {
  rpc Create(CreateInvoiceRequest) returns (CreateInvoiceResponse);

  rpc Pay(PayInvoiceRequest) returns (PayInvoiceResponse);

  rpc Revoke(RevokeInvoiceRequest) returns (RevokeInvoiceResponse);

  rpc Get(GetInvoicesRequest) returns (GetInvoicesResponse);
}

message CreateInvoiceRequest {
  string user_id = 1;
  int64 sender_account_id = 2;
  int64 receiver_account_id = 3;
  google.type.Money amount = 4;
}

message CreateInvoiceResponse {
  model.Invoice invoice = 1;
}

message PayInvoiceRequest {
  string user_id = 1;
  int64 invoice_id = 2;
}

message PayInvoiceResponse {
  model.Invoice invoice = 1;
}

message RevokeInvoiceRequest {
  string user_id = 1;
  int64 invoice_id = 2;
}

message RevokeInvoiceResponse {
  model.Invoice invoice = 1;
}

message GetInvoicesRequest {
  string user_id = 1;
  repeated int64 other_user_account_ids = 2;
  repeated model.InvoiceStatus statuses = 3;
  model.InvoiceType invoice_type = 4;
  model.Pagination pagination = 5;
}

message GetInvoicesResponse {
  repeated model.Invoice invoices = 1;
  google.protobuf.StringValue page_token = 2;
}